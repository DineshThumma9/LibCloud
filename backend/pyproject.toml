[project]
name = "libcloud"
version = "0.1.0"
description = "Generates an SVG logo cloud from your GitHub repositories' dependencies"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "motor>=3.7.1",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.16.0",
    "redis>=8.1.0",
    "sqlmodel>=0.0.48",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
